name: Daily AI Auto-Test Generator

on:
  schedule:
    # Runs at 01:30 UTC every day, which is 7:00 AM IST.
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  generate_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js ws

      - name: Run Auto-Test Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          KIRA_API_KEY: ${{ secrets.KIRA_API_KEY }}
          KIRA: ${{ secrets.KIRA }}
          BYNARA_KEY: ${{ secrets.BYNARA_KEY }}
        run: node scripts/generate_daily_test.mjs
